<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>הרשימות שלי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Heebo', sans-serif;
  min-height: 100vh;
  background: linear-gradient(160deg, #fdf0ff 0%, #f3e8ff 30%, #fce7f3 65%, #fdf4ff 100%);
  color: #2d1b45;
  max-width: 430px;
  margin: 0 auto;
  padding-bottom: 140px;
}

.header {
  padding: 48px 24px 20px;
  text-align: center;
  position: relative;
}
.header-blob {
  position: absolute;
  top: -40px; left: 50%;
  transform: translateX(-50%);
  width: 300px; height: 200px;
  background: radial-gradient(ellipse, rgba(192,132,252,0.25) 0%, transparent 70%);
  pointer-events: none;
}
.header h1 {
  font-size: 28px;
  font-weight: 900;
  background: linear-gradient(135deg, #a855f7, #ec4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -1px;
}
.header .sub {
  font-size: 13px;
  color: #9f7ab8;
  margin-top: 4px;
  font-weight: 400;
}

.input-card {
  margin: 0 16px 16px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 14px;
  box-shadow: 0 4px 24px rgba(168,85,247,0.1), 0 1px 4px rgba(0,0,0,0.05);
  border: 1px solid rgba(255,255,255,0.9);
  display: flex;
  gap: 10px;
  align-items: center;
}
.text-input {
  flex: 1;
  background: rgba(243,232,255,0.5);
  border: 1.5px solid rgba(168,85,247,0.2);
  border-radius: 12px;
  padding: 11px 14px;
  color: #2d1b45;
  font-family: 'Heebo', sans-serif;
  font-size: 15px;
  outline: none;
  transition: all 0.2s;
  text-align: right;
  direction: rtl;
  min-width: 0;
}
.text-input::placeholder { color: #b48fd0; }
.text-input:focus { border-color: rgba(168,85,247,0.5); background: rgba(243,232,255,0.8); }

.btn-mic {
  width: 46px; height: 46px;
  border-radius: 14px; border: none;
  background: linear-gradient(135deg, #e9d5ff, #fbcfe8);
  color: #7c3aed; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; transition: all 0.2s; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(168,85,247,0.2);
}
.btn-mic:active { transform: scale(0.94); }
.btn-mic.recording {
  background: linear-gradient(135deg, #f87171, #fb923c);
  animation: pulse-mic 1s ease-in-out infinite;
  box-shadow: 0 0 0 4px rgba(248,113,113,0.3);
}
@keyframes pulse-mic {
  0%,100% { box-shadow: 0 0 0 4px rgba(248,113,113,0.25); }
  50%      { box-shadow: 0 0 0 8px rgba(248,113,113,0.1); }
}
.btn-add {
  width: 46px; height: 46px;
  border-radius: 14px; border: none;
  background: linear-gradient(135deg, #a855f7, #ec4899);
  color: white; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 300; transition: all 0.2s; flex-shrink: 0;
  box-shadow: 0 4px 14px rgba(168,85,247,0.35);
}
.btn-add:active { transform: scale(0.94); }

.status-bar {
  text-align: center; font-size: 13px; color: #b48fd0;
  min-height: 24px; padding: 0 20px 8px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.status-bar.success { color: #7c3aed; font-weight: 600; }
.status-bar.error   { color: #e11d48; }

.tabs-wrap {
  padding: 0 16px 12px; overflow-x: auto;
  scrollbar-width: none; display: flex; gap: 8px;
}
.tabs-wrap::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; padding: 8px 16px; border-radius: 20px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  background: rgba(255,255,255,0.55); color: #9f7ab8;
  border: 1.5px solid rgba(168,85,247,0.12); transition: all 0.18s;
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
  backdrop-filter: blur(8px); box-shadow: 0 2px 6px rgba(0,0,0,0.04);
}
.tab .badge {
  background: rgba(168,85,247,0.12); border-radius: 10px;
  padding: 1px 7px; font-size: 11px; font-weight: 700;
}
.tab.active {
  background: linear-gradient(135deg, #a855f7, #ec4899);
  color: white; border-color: transparent;
  box-shadow: 0 4px 14px rgba(168,85,247,0.35);
}
.tab.active .badge { background: rgba(255,255,255,0.25); }

.section-card {
  margin: 0 16px 14px;
  background: rgba(255,255,255,0.65);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.9);
  box-shadow: 0 4px 20px rgba(168,85,247,0.08);
  overflow: hidden;
}
.section-title {
  padding: 14px 18px 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.section-title-left {
  display: flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 800; color: #2d1b45;
}
.section-title-left .emoji { font-size: 18px; }

.btn-share-wa {
  display: flex; align-items: center; gap: 5px;
  padding: 6px 12px; border-radius: 12px; border: none;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: white; font-family: 'Heebo', sans-serif;
  font-size: 12px; font-weight: 700; cursor: pointer;
  box-shadow: 0 2px 8px rgba(34,197,94,0.3); transition: all 0.18s;
}
.btn-share-wa:active { transform: scale(0.95); }
.btn-share-wa svg { width: 15px; height: 15px; fill: white; flex-shrink: 0; }

.divider { height: 1px; background: rgba(168,85,247,0.08); margin: 0 16px; }

.list-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 18px; transition: background 0.15s; position: relative;
}
.list-item:active { background: rgba(243,232,255,0.4); }

.item-check {
  width: 24px; height: 24px; border-radius: 8px;
  border: 2px solid rgba(168,85,247,0.3); cursor: pointer;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: all 0.18s; margin-top: 1px;
  background: rgba(255,255,255,0.6);
}
.item-check.checked {
  background: linear-gradient(135deg, #a855f7, #ec4899);
  border-color: transparent; color: white;
}

.item-body { flex: 1; min-width: 0; }
.item-text {
  font-size: 15px; font-weight: 500; color: #2d1b45;
  line-height: 1.4; word-break: break-word;
}
.item-text.done-text { text-decoration: line-through; color: #c4a8d8; }
.item-text-edit {
  width: 100%; background: rgba(243,232,255,0.6);
  border: 1.5px solid rgba(168,85,247,0.4); border-radius: 8px;
  padding: 5px 10px; font-family: 'Heebo', sans-serif;
  font-size: 15px; font-weight: 500; color: #2d1b45;
  outline: none; direction: rtl; text-align: right;
}
.item-meta { font-size: 11px; color: #c4a8d8; margin-top: 2px; }

.item-actions {
  display: flex; flex-direction: column; gap: 4px;
  align-items: center; flex-shrink: 0;
}
.item-btn {
  width: 28px; height: 28px; border-radius: 8px; border: none;
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: #b48fd0; transition: all 0.15s;
}
.item-btn:active { background: rgba(168,85,247,0.1); color: #7c3aed; }
.item-btn.save-btn { color: #22c55e; }
.item-btn.save-btn:active { background: rgba(34,197,94,0.1); }
.item-btn.del-btn:active { color: #e11d48; background: rgba(225,29,72,0.1); }

.done-section-header {
  font-size: 11px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: #c4a8d8; padding: 10px 18px 6px;
}
.done-item .item-text { color: #c4a8d8; }

.clear-done-wrap { padding: 8px 18px 14px; }
.btn-clear-done {
  background: none; border: 1.5px solid rgba(168,85,247,0.2);
  color: #b48fd0; font-family: 'Heebo', sans-serif;
  font-size: 12px; font-weight: 600; padding: 5px 14px;
  border-radius: 10px; cursor: pointer; transition: all 0.15s;
}
.btn-clear-done:active { background: rgba(168,85,247,0.08); }

.empty-state {
  text-align: center; padding: 30px 20px; color: #c4a8d8;
}
.empty-state .big { font-size: 36px; }
.empty-state p { font-size: 13px; margin-top: 8px; }

.dots { display:inline-flex; gap:3px; align-items:center; }
.dots span {
  width:5px;height:5px;border-radius:50%;background:#a855f7;
  animation: dotblink 1.2s infinite;
}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes dotblink{0%,80%,100%{opacity:.2}40%{opacity:1}}

@keyframes slideIn {
  from { opacity:0; transform:translateY(-8px); }
  to   { opacity:1; transform:translateY(0); }
}
.slide-in { animation: slideIn 0.22s ease-out; }

/* ── CAT PILL + DROPDOWN ── */
.cat-pill-wrap { position: relative; flex-shrink: 0; }
.cat-pill {
  display: flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 20px; cursor: pointer;
  font-size: 12px; font-weight: 700; border: none;
  transition: all 0.15s; white-space: nowrap;
  font-family: 'Heebo', sans-serif;
}
.cat-pill:active { transform: scale(0.95); }
.cat-pill .arrow { font-size: 9px; opacity: 0.7; }
.pill-grocery  { background: #f3e8ff; color: #7c3aed; }
.pill-home     { background: #dbeafe; color: #1d4ed8; }
.pill-clothing { background: #fce7f3; color: #be185d; }
.pill-tasks    { background: #dcfce7; color: #15803d; }
.pill-other    { background: #f3f4f6; color: #6b7280; }

.cat-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  background: white;
  border-radius: 14px;
  box-shadow: 0 8px 32px rgba(168,85,247,0.18), 0 2px 8px rgba(0,0,0,0.08);
  border: 1px solid rgba(168,85,247,0.12);
  z-index: 100;
  overflow: hidden;
  min-width: 130px;
  animation: dropIn 0.16s ease-out;
}
@keyframes dropIn {
  from { opacity:0; transform:translateY(-6px) scale(0.97); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}
.cat-dropdown-item {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; cursor: pointer; font-size: 13px;
  font-weight: 600; color: #2d1b45; font-family: 'Heebo', sans-serif;
  transition: background 0.12s; border: none; background: none;
  width: 100%; text-align: right; direction: rtl;
}
.cat-dropdown-item:active { background: rgba(168,85,247,0.08); }
.cat-dropdown-item.current { color: #a855f7; }
.cat-dropdown-item .di-emoji { font-size: 16px; }

/* ── ADD CATEGORY ── */
.add-cat-btn {
  flex-shrink: 0; padding: 8px 14px; border-radius: 20px;
  font-size: 13px; font-weight: 700; cursor: pointer;
  background: rgba(255,255,255,0.55); color: #a855f7;
  border: 1.5px dashed rgba(168,85,247,0.35); transition: all 0.18s;
  display: flex; align-items: center; gap: 5px; white-space: nowrap;
  backdrop-filter: blur(8px); font-family: 'Heebo', sans-serif;
}
.add-cat-btn:active { background: rgba(168,85,247,0.08); }

/* modal overlay */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(45,27,69,0.35);
  backdrop-filter: blur(4px); z-index: 200;
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn 0.18s ease-out;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal-sheet {
  background: linear-gradient(160deg,#fdf0ff,#fce7f3);
  border-radius: 24px 24px 0 0;
  padding: 24px 20px 40px;
  width: 100%; max-width: 430px;
  box-shadow: 0 -8px 40px rgba(168,85,247,0.18);
  animation: sheetUp 0.22s ease-out;
}
@keyframes sheetUp { from{transform:translateY(60px);opacity:0} to{transform:translateY(0);opacity:1} }
.modal-title {
  font-size: 18px; font-weight: 900; color: #2d1b45;
  margin-bottom: 18px; text-align: center;
}
.modal-row { display: flex; gap: 10px; margin-bottom: 12px; }
.modal-input {
  flex: 1; background: rgba(255,255,255,0.7);
  border: 1.5px solid rgba(168,85,247,0.25); border-radius: 12px;
  padding: 11px 14px; font-family: 'Heebo', sans-serif;
  font-size: 15px; font-weight: 500; color: #2d1b45;
  outline: none; direction: rtl; text-align: right;
}
.modal-input:focus { border-color: rgba(168,85,247,0.5); }
.emoji-grid {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 16px;
}
.emoji-opt {
  width: 40px; height: 40px; border-radius: 10px; border: 2px solid transparent;
  background: rgba(255,255,255,0.6); font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.emoji-opt.selected { border-color: #a855f7; background: #f3e8ff; }
.color-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.color-opt {
  width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  border: 3px solid transparent; transition: all 0.15s;
}
.color-opt.selected { border-color: #2d1b45; transform: scale(1.15); }
.modal-btns { display: flex; gap: 10px; }
.modal-btn {
  flex: 1; padding: 12px; border-radius: 14px; border: none;
  font-family: 'Heebo', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;
  transition: all 0.18s;
}
.modal-btn-cancel { background: rgba(168,85,247,0.1); color: #9f7ab8; }
.modal-btn-save { background: linear-gradient(135deg,#a855f7,#ec4899); color: white; box-shadow: 0 4px 14px rgba(168,85,247,0.35); }
.modal-btn-save:active { transform: scale(0.97); }

.custom-cat-manage {
  margin: 0 16px 10px;
  display: flex; flex-wrap: wrap; gap: 6px;
}
.custom-cat-tag {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 14px;
  font-size: 12px; font-weight: 700; font-family: 'Heebo', sans-serif;
}
.custom-cat-tag .del-cat {
  background: none; border: none; cursor: pointer;
  font-size: 13px; opacity: 0.5; padding: 0 2px; line-height: 1;
}
.custom-cat-tag .del-cat:hover { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <div class="header-blob"></div>
  <h1>הרשימות שלי ✨</h1>
  <div class="sub">דברי, הקלידי — הכל נכנס למקום הנכון</div>
</div>

<div class="input-card">
  <button class="btn-mic" id="micBtn" onclick="toggleRecording()">🎤</button>
  <input class="text-input" id="textInput" placeholder="מה צריך? (הדבקי כמה שורות יחד)" onkeydown="handleKey(event)" onpaste="handlePaste(event)" />
  <button class="btn-add" onclick="addFromInput()">+</button>
</div>

<div class="status-bar" id="statusBar"></div>

<div class="tabs-wrap" id="tabsWrap"></div>
<div id="modalRoot"></div>

<div id="listsRoot"></div>

<script>
const DEFAULT_CATS = {
  grocery:  { label:'מכולת',  emoji:'🛒', custom: false },
  home:     { label:'בית',    emoji:'🏠', custom: false },
  clothing: { label:'ביגוד',  emoji:'👗', custom: false },
  tasks:    { label:'משימות', emoji:'✅', custom: false },
  other:    { label:'אחר',    emoji:'📦', custom: false },
};

let CATS = Object.assign({}, DEFAULT_CATS, JSON.parse(localStorage.getItem('myli_cats') || '{}'));
let CAT_KEYS = Object.keys(CATS);

function saveCats() {
  // save only custom cats
  const custom = {};
  Object.entries(CATS).forEach(([k,v]) => { if(v.custom) custom[k] = v; });
  localStorage.setItem('myli_cats', JSON.stringify(custom));
}

let items = JSON.parse(localStorage.getItem('myli2') || '[]');
let currentFilter = 'all';
let editingId = null;
let isRecording = false;
let recognition = null;

function save() { localStorage.setItem('myli2', JSON.stringify(items)); }

async function classifyItem(text) {
  try {
    const catList = CAT_KEYS.map(k => `${k} = ${CATS[k].label}: ${getCatHint(k)}`).join('\n');
    const API_KEY = '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';
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": API_KEY,
        "anthropic-version": "2023-06-01"
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: 20,
        system: `Classify Hebrew text into one of these categories. Reply with ONLY the category key (one word).
If unsure or doesn't fit any category well, reply: other

Categories:
${catList}`,
        messages: [{ role:"user", content: text }]
      })
    });
    const d = await res.json();
    const cat = d.content?.[0]?.text?.trim().toLowerCase().replace(/[^a-z_]/g,'');
    return CAT_KEYS.includes(cat) ? cat : 'other';
  } catch(e) { return 'other'; }
}

function getCatHint(k) {
  const hints = {
    grocery: 'food, drinks, cleaning products, toiletries, pharmacy, consumables',
    home: 'furniture, appliances, tools, decor, non-consumable household items',
    clothing: 'clothes, shoes, accessories, bags, jewelry',
    tasks: 'appointments, errands, reminders, phone calls, to-do actions',
    other: 'anything that does not fit other categories',
  };
  return hints[k] || CATS[k].label;
}

async function addItem(text) {
  text = text.trim();
  if (!text) return;
  const cat = await classifyItem(text);
  items.unshift({
    id: Date.now() + Math.random(), text, cat, done: false,
    date: new Date().toLocaleString('he-IL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})
  });
  save(); 
// ── ADD CATEGORY MODAL ────────────────────────────────────────────────────────
const EMOJI_OPTS = ['🧴','💊','🧹','🐾','🌿','🎮','📚','🎨','🏋️','🧸','🚗','💻','🎁','🛠','🧺','🌸','🍽','💡'];
const COLOR_OPTS = [
  {bg:'#fef9c3',text:'#a16207'},{bg:'#d1fae5',text:'#065f46'},{bg:'#fee2e2',text:'#991b1b'},
  {bg:'#e0f2fe',text:'#0369a1'},{bg:'#ede9fe',text:'#5b21b6'},{bg:'#fce7f3',text:'#9d174d'},
  {bg:'#f0fdf4',text:'#166534'},{bg:'#fff7ed',text:'#9a3412'},{bg:'#f0f9ff',text:'#0c4a6e'},
];
let newCatEmoji = '📦';
let newCatColor = COLOR_OPTS[0];

function openAddCatModal() {
  newCatEmoji = '📦'; newCatColor = COLOR_OPTS[0];
  const emojiGrid = EMOJI_OPTS.map(e=>`<div class="emoji-opt${e===newCatEmoji?' selected':''}" onclick="pickEmoji('${e}',this)">${e}</div>`).join('');
  const colorGrid = COLOR_OPTS.map((c,i)=>`<div class="color-opt${i===0?' selected':''}" style="background:${c.bg};border-color:${i===0?'#2d1b45':'transparent'}" onclick="pickColor(${i},this)"></div>`).join('');
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="closeCatModal(event)">
      <div class="modal-sheet" onclick="event.stopPropagation()">
        <div class="modal-title">✨ קטגוריה חדשה</div>
        <div class="modal-row">
          <span style="font-size:28px;line-height:1;padding-top:6px" id="previewEmoji">📦</span>
          <input class="modal-input" id="newCatName" placeholder="שם הקטגוריה…" maxlength="20" />
        </div>
        <div style="font-size:12px;font-weight:700;color:#b48fd0;margin-bottom:8px">אימוג'י</div>
        <div class="emoji-grid" id="emojiGrid">${emojiGrid}</div>
        <div style="font-size:12px;font-weight:700;color:#b48fd0;margin-bottom:8px">צבע</div>
        <div class="color-grid" id="colorGrid">${colorGrid}</div>
        <div class="modal-btns">
          <button class="modal-btn modal-btn-cancel" onclick="document.getElementById('modalRoot').innerHTML=''">ביטול</button>
          <button class="modal-btn modal-btn-save" onclick="saveNewCat()">שמרי ✓</button>
        </div>
      </div>
    </div>`;
}

function closeCatModal(e) {
  if(e.target.classList.contains('modal-overlay')) document.getElementById('modalRoot').innerHTML='';
}

function pickEmoji(e, el) {
  newCatEmoji = e;
  document.getElementById('previewEmoji').textContent = e;
  document.querySelectorAll('.emoji-opt').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
}

function pickColor(i, el) {
  newCatColor = COLOR_OPTS[i];
  document.querySelectorAll('.color-opt').forEach((x,j)=>{
    x.classList.toggle('selected', j===i);
    x.style.borderColor = j===i ? '#2d1b45' : 'transparent';
  });
}

function saveNewCat() {
  const name = document.getElementById('newCatName').value.trim();
  if (!name) { document.getElementById('newCatName').focus(); return; }
  const key = 'cat_' + Date.now();
  CATS[key] = { label: name, emoji: newCatEmoji, custom: true, bg: newCatColor.bg, textColor: newCatColor.text };
  CAT_KEYS = Object.keys(CATS);
  saveCats();
  document.getElementById('modalRoot').innerHTML = '';
  render(); updateTabs();
}

function deleteCustomCat(key) {
  if (!CATS[key]?.custom) return;
  // move items from deleted cat to 'other'
  items.forEach(i=>{ if(i.cat===key) i.cat='other'; });
  delete CATS[key];
  CAT_KEYS = Object.keys(CATS);
  saveCats(); save(); render(); updateTabs();
}
render(); updateTabs();

async function addMultipleItems(lines) {
  const valid = lines.map(l=>l.trim()).filter(l=>l.length>0);
  if (!valid.length) return;
  setStatus('detecting', `<div class="dots"><span></span><span></span><span></span></div> מסווגת ${valid.length} פריטים…`);
  // classify all in parallel
  const results = await Promise.all(valid.map(text => addItem(text)));
  const counts = {};
  results.forEach(cat => { if(cat) counts[cat] = (counts[cat]||0)+1; });
  const summary = Object.entries(counts).map(([k,v])=>`${CATS[k].emoji} ${v}`).join('  ');
  setStatus('success', `✓ נוספו ${valid.length} פריטים  ${summary}`);
  setTimeout(() => setStatus('',''), 3000);
}

function addFromInput() {
  const v = document.getElementById('textInput').value;
  if (!v.trim()) return;
  document.getElementById('textInput').value = '';
  const lines = v.split(/\n|,|،/).map(l=>l.trim()).filter(Boolean);
  if (lines.length > 1) {
    addMultipleItems(lines);
  } else {
    addMultipleItems([v]);
  }
}

function handlePaste(e) {
  setTimeout(() => {
    const v = document.getElementById('textInput').value;
    const lines = v.split(/\n/).map(l=>l.trim()).filter(Boolean);
    if (lines.length > 1) {
      document.getElementById('textInput').value = '';
      addMultipleItems(lines);
    }
  }, 10);
}

function handleKey(e) { if (e.key==='Enter') addFromInput(); }

function toggleRecording() { isRecording ? stopRecording() : startRecording(); }
function startRecording() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setStatus('error','❌ הדפדפן לא תומך בזיהוי קול'); return; }
  recognition = new SR();
  recognition.lang = 'he-IL'; recognition.continuous = false; recognition.interimResults = true;
  recognition.onstart = () => {
    isRecording = true;
    const b = document.getElementById('micBtn');
    b.classList.add('recording'); b.textContent = '⏹';
    setStatus('detecting','🎙 מקשיבה…');
  };
  recognition.onresult = (e) => {
    const t = Array.from(e.results).map(r=>r[0].transcript).join('');
    document.getElementById('textInput').value = t;
    if (e.results[0].isFinal) { stopRecording(); addItem(t); document.getElementById('textInput').value=''; }
  };
  recognition.onerror = () => { setStatus('error','❌ שגיאה בהקלטה'); stopRecording(); };
  recognition.onend = () => { if(isRecording) stopRecording(); };
  recognition.start();
}
function stopRecording() {
  isRecording = false;
  if(recognition) recognition.stop();
  const b = document.getElementById('micBtn');
  b.classList.remove('recording'); b.textContent = '🎤';
}

function toggleDone(id) {
  const i = items.find(x=>x.id===id);
  if(i){ i.done=!i.done; save(); render(); updateTabs(); }
}
function deleteItem(id) { items=items.filter(x=>x.id!==id); save(); render(); updateTabs(); }
function startEdit(id) { editingId=id; render(); setTimeout(()=>{ const el=document.getElementById('edit-'+id); if(el){el.focus();el.select();} },50); }
function saveEdit(id) {
  const el=document.getElementById('edit-'+id);
  if(!el) return;
  const val=el.value.trim();
  if(val){ const i=items.find(x=>x.id===id); if(i) i.text=val; }
  editingId=null; save(); render();
}
function cancelEdit() { editingId=null; render(); }
function clearDone(cat) { items=items.filter(x=>!(x.done&&x.cat===cat)); save(); render(); updateTabs(); }

function shareWA(cat) {
  const catItems=items.filter(x=>x.cat===cat&&!x.done);
  if(!catItems.length){ alert('אין פריטים פעילים לשיתוף'); return; }
  let msg=`${CATS[cat].emoji} *רשימת ${CATS[cat].label}*\n\n`;
  catItems.forEach((it,i)=>{ msg+=`${i+1}. ${it.text}\n`; });
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

function setStatus(type, html) {
  const bar=document.getElementById('statusBar');
  bar.className='status-bar'+(type?' '+type:'');
  bar.innerHTML=html;
}

function updateTabs() {
  const counts = {};
  CAT_KEYS.forEach(k => counts[k] = 0);
  items.forEach(i=>{ if(!i.done && counts[i.cat] !== undefined) counts[i.cat]++; else if(!i.done) counts[i.cat] = (counts[i.cat]||0)+1; });
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  const wrap = document.getElementById('tabsWrap');
  let html = `<div class="tab ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">הכל <span class="badge">${total}</span></div>`;
  CAT_KEYS.forEach(k=>{
    html+=`<div class="tab ${currentFilter===k?'active':''}" onclick="setFilter('${k}')">${CATS[k].emoji} ${CATS[k].label} <span class="badge">${counts[k]||0}</span></div>`;
  });
  html += `<button class="add-cat-btn" onclick="openAddCatModal()">＋ קטגוריה</button>`;
  wrap.innerHTML = html;
}
function setFilter(cat) { currentFilter=cat; render(); updateTabs(); }

  const root=document.getElementById('listsRoot');
  const catsToShow=currentFilter==='all'?CAT_KEYS:[currentFilter];
  let html='';
  catsToShow.forEach(cat=>{

        </div>
        <button class="btn-share-wa" onclick="shareWA('${cat}')">
          <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          שתפי
        </button>
      </div>
      <div class="divider"></div>`;
    if(!catItems.length){
      html+=`<div class="empty-state"><div class="big">${CATS[cat].emoji}</div><p>אין פריטים עדיין</p></div>`;
    } else {
      active.forEach(item=>{ html+=renderItem(item,false); });
      if(done.length){
        html+=`<div class="done-section-header">✓ הושלמו</div>`;
        done.forEach(item=>{ html+=renderItem(item,true); });
        html+=`<div class="clear-done-wrap"><button class="btn-clear-done" onclick="clearDone('${cat}')">🗑 נקי הושלמו</button></div>`;
      }
    }
    html+=`</div>`;
  });
  if(!html) html=`<div class="section-card"><div class="empty-state"><div class="big">🎀</div><p>הוסיפי משהו כדי להתחיל!</p></div></div>`;
  root.innerHTML=html;
}

function renderItem(item,isDone){
  const isEditing=editingId===item.id;
  const pillDropdown = CAT_KEYS.map(k=>`
    <button class="cat-dropdown-item ${k===item.cat?'current':''}" onclick="reclassify(${item.id},'${k}',event)">
      <span class="di-emoji">${CATS[k].emoji}</span>${CATS[k].label}${k===item.cat?' ✓':''}
    </button>`).join('');
  return `<div class="list-item slide-in ${isDone?'done-item':''}">
    <div class="item-check ${item.done?'checked':''}" onclick="toggleDone(${item.id})">${item.done?'✓':''}</div>
    <div class="item-body">
      ${isEditing
        ?`<input class="item-text-edit" id="edit-${item.id}" value="${escHtml(item.text)}" onkeydown="if(event.key==='Enter')saveEdit(${item.id});if(event.key==='Escape')cancelEdit()" />`
        :`<div class="item-text ${isDone?'done-text':''}">${escHtml(item.text)}</div>`
      }
      <div class="item-meta">${item.date}</div>
    </div>
    <div class="cat-pill-wrap">
      <button class="cat-pill pill-${item.cat}" style="${CATS[item.cat]?.bg?`background:${CATS[item.cat].bg};color:${CATS[item.cat].textColor}`:''}" onclick="toggleDropdown(${item.id},event)">
        ${CATS[item.cat]?.emoji||'📦'} ${CATS[item.cat]?.label||item.cat} <span class="arrow">▾</span>
      </button>
      <div class="cat-dropdown" id="dd-${item.id}" style="display:none">${pillDropdown}</div>
    </div>
    <div class="item-actions">
      ${isEditing
        ?`<button class="item-btn save-btn" onclick="saveEdit(${item.id})">✓</button><button class="item-btn" onclick="cancelEdit()">✕</button>`
        :`<button class="item-btn" onclick="startEdit(${item.id})">✏️</button><button class="item-btn del-btn" onclick="deleteItem(${item.id})">🗑</button>`
      }
    </div>
  </div>`;
}


let openDropdownId = null;

function toggleDropdown(id, e) {
  e.stopPropagation();
  const dd = document.getElementById('dd-'+id);
  if (!dd) return;
  if (openDropdownId && openDropdownId !== id) {
    const prev = document.getElementById('dd-'+openDropdownId);
    if (prev) prev.style.display = 'none';
  }
  const isOpen = dd.style.display !== 'none';
  dd.style.display = isOpen ? 'none' : 'block';
  openDropdownId = isOpen ? null : id;
}

function reclassify(id, newCat, e) {
  e.stopPropagation();
  const item = items.find(x=>x.id===id);
  if (item) { item.cat = newCat; save(); render(); updateTabs(); }
  openDropdownId = null;
}

document.addEventListener('click', () => {
  if (openDropdownId) {
    const dd = document.getElementById('dd-'+openDropdownId);
    if (dd) dd.style.display = 'none';
    openDropdownId = null;
  }
});

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render(); updateTabs();
